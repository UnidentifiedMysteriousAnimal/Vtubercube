<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自定义图片 3D 魔方 · 打乱与还原</title>
<style>
:root{color-scheme:light;--bg:#f7f3e9;--panel:#fffdf7;--line:#e5ddce;--text:#3c352b;--muted:#776f62;--accent:#a98a54}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#fffdf7 0%,var(--bg) 72%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1200px;margin:auto;padding:22px}h1{font-size:clamp(24px,4vw,36px);margin:0 0 6px}p{color:var(--muted);margin:5px 0 14px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,.9fr);gap:18px}.panel{background:linear-gradient(145deg,#fffefa,#f7f1e5);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 32px #7c6b4a18}.stage{position:relative;height:640px;min-height:640px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8f4ea;border:1px solid #e8dfcf;border-radius:13px}.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}.overlay{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:#766b5a;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.btn{border:1px solid #d8cbb5;border-radius:10px;padding:10px 13px;color:var(--text);background:#f2eadb;cursor:pointer;font-weight:650}.btn.primary{background:linear-gradient(135deg,#e8d3a8,#c5a66b);border-color:transparent;color:#352816}.btn:disabled{opacity:.4;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(1.12)}.status{margin-top:12px;padding:10px 12px;background:#f7f0e3;border:1px solid var(--line);border-radius:10px;color:#5e5344;min-height:42px}.section-title{font-size:17px;font-weight:750;margin:0 0 12px}.faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.face{border:1px solid #e5dac7;border-radius:12px;padding:10px;background:#fbf7ef}.face-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.face-head b{font-size:14px}.face-head small{color:var(--muted)}.preview{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#f2eadb;display:block;border:1px solid #e0d4c0}.upload{display:block;margin-top:8px;font-size:12px;color:#c6d8ef;overflow-wrap:anywhere}.upload input{width:100%;font-size:12px;margin-top:5px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.setting{padding:11px;background:#fbf7ef;border:1px solid var(--line);border-radius:11px}.setting label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#625746;margin-bottom:8px}.setting input[type=range]{width:100%;accent-color:var(--accent)}.hint{font-size:12px;color:#817565;margin-top:12px}.movebox{margin-top:12px;font:12px/1.8 ui-monospace,monospace;color:#81715a;overflow-wrap:anywhere;max-height:70px;overflow:auto}.footer{color:#928675;font-size:12px;margin-top:18px}
@media(max-width:820px){main{padding:13px}.layout{grid-template-columns:1fr}.stage{height:560px;min-height:560px}.faces{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:460px){.faces{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:440px;min-height:440px}.settings{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>自定义图片 3D 魔方</h1>
  <p>上传六张图片作为六个面，自动切成 3×3 贴纸。随机打乱，再按真实逆步骤逐步还原。所有处理都在本地浏览器完成。</p>
  <div class="layout">
    <section class="panel">
      <div class="stage" id="stage">
        <canvas id="gl"></canvas>
        <div class="overlay"><span>拖动旋转视角 · 滚轮缩放</span><span id="phase">已就绪</span></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="scramble">随机打乱</button>
        <button class="btn primary" id="solve" disabled>自动还原</button>
        <button class="btn" id="play">▶ 播放</button>
        <button class="btn" id="pause">Ⅱ 暂停</button>
        <button class="btn" id="step">单步前进</button>
        <button class="btn" id="replay">重播还原</button>
        <button class="btn" id="reset">重置</button>
      </div>
      <div class="status" id="status">正在初始化 3D 画布…</div>
      <div class="movebox" id="moves">转动记录：暂无</div>
    </section>
    <aside class="panel">
      <h2 class="section-title">上传六个面</h2>
      <div class="faces" id="faces"></div>
      <div class="settings">
        <div class="setting"><label for="count">打乱步数 <b id="countVal">20</b></label><input id="count" type="range" min="5" max="40" value="20"></div>
        <div class="setting"><label for="speed">动画速度 <b id="speedVal">1.0×</b></label><input id="speed" type="range" min="1" max="10" value="5"></div>
      </div>
      <p class="hint">建议上传正方形图片。非正方形图片会完整保留，并在空白区域补边以适配方形贴纸。默认六面颜色不同；未上传的面会显示纯色贴纸。上传图片后会重新设置为新的初始状态。</p>
      <p class="hint">操作说明：打乱会随机转动各层；“自动还原”会把这些转动按逆序反向执行，因此能精确回到打乱前的图片布局。</p>
    </aside>
  </div>
  <div class="footer">独立 HTML · 不加载外部库、不请求网络 · WebGL 由浏览器本地渲染</div>
</main>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id);
const faceDefs=[
 {key:'R',name:'右面 R',color:'#d93636',file:null},
 {key:'L',name:'左面 L',color:'#ff8b25',file:null},
 {key:'U',name:'上面 U',color:'#f4f5f8',file:null},
 {key:'D',name:'下面 D',color:'#f3d52b',file:null},
 {key:'F',name:'前面 F',color:'#1dc96c',file:null},
 {key:'B',name:'后面 B',color:'#2877ed',file:null}
];
const facesEl=$('faces');
faceDefs.forEach((f,i)=>{
 const card=document.createElement('div');card.className='face';
 card.innerHTML=`<div class="face-head"><b>${f.name}</b><small>3×3</small></div><img class="preview" id="prev${i}" alt="${f.name}预览"><label class="upload">选择图片<input type="file" accept="image/*" id="file${i}"></label>`;
 facesEl.appendChild(card);
 $('file'+i).addEventListener('change',e=>{
   const file=e.target.files&&e.target.files[0];if(!file)return;
   const url=URL.createObjectURL(file),img=new Image();
   img.onload=()=>{f.file=img; URL.revokeObjectURL(url); $('prev'+i).src=makeImagePreview(img); rebuildTextures();resetCube();setStatus(`${f.name}已载入：整张图片按比例放入正方形，再精确分成 3×3 九块。`);};
   img.onerror=()=>setStatus('图片读取失败，请换一张常见格式的图片。');
   img.src=url;
 });
});
function makePreview(i){const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d');x.fillStyle=faceDefs[i].color;x.fillRect(0,0,120,120);x.strokeStyle='#111827';x.lineWidth=5;for(let k=1;k<3;k++){x.beginPath();x.moveTo(k*40,0);x.lineTo(k*40,120);x.moveTo(0,k*40);x.lineTo(120,k*40);x.stroke()}return c.toDataURL();}
function makeImagePreview(img){const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d');x.fillStyle='#182840';x.fillRect(0,0,300,300);const scale=Math.min(300/img.width,300/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(300-w)/2,(300-h)/2,w,h);x.strokeStyle='rgba(5,12,24,.88)';x.lineWidth=2;for(let k=1;k<3;k++){x.beginPath();x.moveTo(k*100,0);x.lineTo(k*100,300);x.moveTo(0,k*100);x.lineTo(300,k*100);x.stroke()}return c.toDataURL();}
faceDefs.forEach((f,i)=>$('prev'+i).src=makePreview(i));

const canvas=$('gl'),stage=$('stage');let gl=null,program=null,buf=null,ibo=null;
const VSH=`attribute vec3 aPos;attribute vec3 aNormal;attribute vec2 aUV;uniform mat4 uMVP;uniform mat4 uModel;varying vec2 vUV;varying vec3 vNormal;varying vec3 vWorld;void main(){vec4 w=uModel*vec4(aPos,1.0);vWorld=w.xyz;vNormal=mat3(uModel)*aNormal;vUV=aUV;gl_Position=uMVP*vec4(aPos,1.0);}`;
const FSH=`precision mediump float;uniform sampler2D uTex;uniform vec3 uColor;uniform float uUseTex;varying vec2 vUV;varying vec3 vNormal;varying vec3 vWorld;void main(){vec3 n=normalize(vNormal);vec3 light=normalize(vec3(-0.45,0.8,0.9));float d=max(dot(n,light),0.0);vec3 base=mix(uColor,texture2D(uTex,vUV).rgb,uUseTex);vec3 shaded=base*(0.58+0.42*d);vec3 imageBright=base*(0.90+0.10*d);vec3 col=mix(shaded,imageBright,uUseTex);gl_FragColor=vec4(col,1.0);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function initGL(){
 try{gl=canvas.getContext('webgl',{antialias:true,alpha:false})||canvas.getContext('experimental-webgl');if(!gl)throw Error('浏览器未启用 WebGL');
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VSH));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FSH));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 buf=gl.createBuffer();ibo=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);resize();rebuildTextures();requestAnimationFrame(render);
 }catch(e){setStatus('3D 初始化失败：'+e.message+'。请使用较新的 Chrome、Edge 或 Firefox。');}
}
let texByFace={};
function rebuildTextures(){
 if(!gl)return;
 Object.values(texByFace).forEach(t=>gl.deleteTexture(t));texByFace={};
 faceDefs.forEach(f=>{
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const c=document.createElement('canvas');c.width=c.height=768;const x=c.getContext('2d');
  if(f.file){const im=f.file; x.fillStyle='#182840';x.fillRect(0,0,768,768);const scale=Math.min(768/im.width,768/im.height),w=im.width*scale,h=im.height*scale;x.drawImage(im,(768-w)/2,(768-h)/2,w,h);}
  else{x.fillStyle=f.color;x.fillRect(0,0,768,768);}
  // Texture is split logically into nine UV regions at render time.
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  texByFace[f.key]=t;
 });
}
const facesMap={
 R:{normal:[1,0,0],u:[0,0,-1],v:[0,1,0],key:'R'},
 L:{normal:[-1,0,0],u:[0,0,1],v:[0,1,0],key:'L'},
 U:{normal:[0,1,0],u:[1,0,0],v:[0,0,-1],key:'U'},
 D:{normal:[0,-1,0],u:[1,0,0],v:[0,0,1],key:'D'},
 F:{normal:[0,0,1],u:[1,0,0],v:[0,1,0],key:'F'},
 B:{normal:[0,0,-1],u:[-1,0,0],v:[0,1,0],key:'B'}
};
const stickers=[]; // each cubie sticker follows its cubie through exact quarter-turn transforms
function vecEq(a,b){return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]}
function buildCube(){
 stickers.length=0;
 for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
  const pos=[x,y,z];
  for(const [face,def] of Object.entries(facesMap)){
   if(pos[0]*def.normal[0]+pos[1]*def.normal[1]+pos[2]*def.normal[2]===1){
    stickers.push({pos:pos.slice(),normal:def.normal.slice(),u:def.u.slice(),v:def.v.slice(),face,uv:[(1+pos[def.u[0]!==0?0:def.u[1]!==0?1:2]*def.u[def.u[0]!==0?0:def.u[1]!==0?1:2])/2,(1+pos[def.v[0]!==0?0:def.v[1]!==0?1:2]*def.v[def.v[0]!==0?0:def.v[1]!==0?1:2])/2]});
   }
  }
 }
 // Sticker UV is calculated from the sticker's local coordinates on its original face.
 stickers.forEach(s=>{
  const d=facesMap[s.face];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const coordU=dot(s.pos,d.u),coordV=dot(s.pos,d.v);
  s.tile=[coordU/3+0.5,coordV/3+0.5]; // exact tile centers: 1/6, 1/2, 5/6; each sticker samples exactly one third
 });
}
buildCube();
let camera={yaw:-0.65,pitch:0.48,dist:5.2},drag=null,anim=null,queue=[],history=[],initialState=null,phase='ready',lastTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rotateVec(v,axis,dir){ // dir is +1 or -1 quarter turn around positive axis
 const [x,y,z]=v;
 if(axis===0)return dir===1?[x,-z,y]:[x,z,-y];
 if(axis===1)return dir===1?[z,y,-x]:[-z,y,x];
 return dir===1?[-y,x,z]:[y,-x,z];
}
function rotateSticker(s,m){s.pos=rotateVec(s.pos,m.axis,m.dir);s.normal=rotateVec(s.normal,m.axis,m.dir);s.u=rotateVec(s.u,m.axis,m.dir);s.v=rotateVec(s.v,m.axis,m.dir);}
function cloneState(){return stickers.map(s=>({pos:s.pos.slice(),normal:s.normal.slice(),u:s.u.slice(),v:s.v.slice(),face:s.face,tile:s.tile.slice()}));}
function restoreState(st){stickers.splice(0,stickers.length,...st.map(s=>({pos:s.pos.slice(),normal:s.normal.slice(),u:s.u.slice(),v:s.v.slice(),face:s.face,tile:s.tile.slice()})));}
initialState=cloneState();
function applyMove(m){stickers.forEach(s=>{if(s.pos[m.axis]===m.layer)rotateSticker(s,m);});}
function invertMove(m){return {axis:m.axis,layer:m.layer,dir:-m.dir,label:m.label};}
function moveLabel(m){const face=m.axis===0?(m.layer===1?'R':'L'):m.axis===1?(m.layer===1?'U':'D'):(m.layer===1?'F':'B');return face+(m.dir===1?"'":'');}
function randomMoves(n){const out=[];let prev=-1;for(let i=0;i<n;i++){let axis;do{axis=Math.floor(Math.random()*3)}while(axis===prev);prev=axis;const layer=Math.random()<.5?-1:1;const dir=Math.random()<.5?1:-1;out.push({axis,layer,dir,label:''});out[out.length-1].label=moveLabel(out[out.length-1]);}return out;}
function setStatus(s){$('status').textContent=s;}
function updateMoves(){const list=history.map(m=>m.label);$('moves').textContent='转动记录：'+(list.length?list.join(' '):'暂无');}
function resetCube(){if(anim)anim=null;queue=[];history=[];restoreState(initialState);phase='ready';$('phase').textContent='已就绪';$('solve').disabled=true;updateMoves();setStatus('已回到当前六面图片的初始状态。');}
function beginSequence(moves,after){queue=moves.map(m=>({...m}));anim=null;phase='running';afterSequence=after||null;setStatus(`准备执行 ${queue.length} 步转动…`);if(queue.length)startNext();else finishSequence();}
let afterSequence=null;
function startNext(){if(!queue.length){finishSequence();return;}const m=queue.shift();anim={move:m,t:0,duration:Math.max(100,620-(+$('speed').value)*52)};phase='running';}
function finishSequence(){anim=null;phase='ready';$('phase').textContent='已就绪';if(afterSequence){const f=afterSequence;afterSequence=null;f();}else setStatus('动画完成。');}
function scramble(){anim=null;queue=[];restoreState(initialState);history=[];const ms=randomMoves(+$('count').value);history=ms.slice();$('solve').disabled=false;updateMoves();beginSequence(ms,()=>{phase='scrambled';$('phase').textContent='已打乱';setStatus(`打乱完成：${ms.length} 步。点击“自动还原”开始逆序还原。`);});}
function solve(){if(!history.length){setStatus('请先随机打乱魔方。');return;}const inv=history.slice().reverse().map(invertMove);$('solve').disabled=true;beginSequence(inv,()=>{restoreState(initialState);phase='solved';$('phase').textContent='已还原';setStatus('还原完成！六个面已恢复到上传图片的初始布局。');});}
function replay(){if(!history.length){setStatus('请先随机打乱魔方，再重播还原。');return;}restoreState(initialState);anim=null;queue=[];const ms=history.slice();beginSequence(ms,()=>{phase='scrambled';$('phase').textContent='已打乱';setStatus('重新打乱完成，正在准备还原。');solve();});}
$('scramble').onclick=scramble;$('solve').onclick=solve;$('play').onclick=()=>{if(anim){setStatus('动画正在播放。');return;}if(queue.length){startNext();return;}if(phase==='scrambled'){solve();return;}if(phase==='solved'||phase==='ready'){scramble();return;}setStatus('没有待播放的转动。');};
$('pause').onclick=()=>{if(anim){paused=true;setStatus('已暂停。点击“播放”继续。');}else if(queue.length){paused=false;startNext();}};
$('step').onclick=()=>{if(anim){const m=anim.move;anim=null;applyMove(m);if(phase==='running')history.push(m);startNext();return;}if(queue.length){paused=false;const m=queue.shift();applyMove(m);startNext();setStatus('已前进一步。');}else setStatus('当前没有待执行的步骤。');};
$('replay').onclick=replay;$('reset').onclick=resetCube;
$('count').oninput=e=>$('countVal').textContent=e.target.value;
$('speed').oninput=e=>$('speedVal').textContent=(e.target.value/5).toFixed(1)+'×';
let paused=false;
const oldStartNext=startNext;startNext=function(){if(paused)return;oldStartNext();};
$('play').onclick=()=>{if(paused){paused=false;if(!anim&&queue.length)startNext();setStatus('继续播放。');return;}if(anim){setStatus('动画正在播放。');return;}if(queue.length){startNext();return;}if(phase==='scrambled'){solve();return;}if(phase==='solved'||phase==='ready')scramble();};
$('pause').onclick=()=>{if(anim||queue.length){paused=true;setStatus('已暂停。点击“播放”继续。');}};
$('step').onclick=()=>{paused=false;if(anim){const m=anim.move;anim=null;applyMove(m);startNext();setStatus('已完成当前转动，继续下一步。');}else if(queue.length){const m=queue.shift();applyMove(m);setStatus('已前进一步。');}else setStatus('当前没有待执行的步骤。');};
function mat4(){return new Float32Array(16)}
function multiply(a,b){const o=mat4();for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}
function perspective(fovy,aspect,near,far){const f=1/Math.tan(fovy/2),nf=1/(near-far),o=mat4();o[0]=f/aspect;o[5]=f;o[10]=(far+near)*nf;o[11]=-1;o[14]=2*far*near*nf;return o;}
function lookAt(eye,center,up){const z=norm([eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]]),x=norm(cross(up,z)),y=cross(z,x),o=mat4();o[0]=x[0];o[1]=y[0];o[2]=z[0];o[4]=x[1];o[5]=y[1];o[6]=z[1];o[8]=x[2];o[9]=y[2];o[10]=z[2];o[12]=-dot(x,eye);o[13]=-dot(y,eye);o[14]=-dot(z,eye);o[15]=1;return o;}
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
function identity(){const m=mat4();m[0]=m[5]=m[10]=m[15]=1;return m;}
function rotateModel(m,axis,ang){const c=Math.cos(ang),s=Math.sin(ang),r=identity();if(axis===0){r[5]=c;r[6]=s;r[9]=-s;r[10]=c;}else if(axis===1){r[0]=c;r[2]=-s;r[8]=s;r[10]=c;}else{r[0]=c;r[1]=s;r[4]=-s;r[5]=c;}return multiply(m,r);}
function resize(){if(!gl)return;const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(canvas.clientWidth*dpr)),h=Math.max(1,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);}
function createStickerMesh(s,angle=0){
 const size=.315,half=size/2,offset=.505;
 const center=s.pos.map(v=>v*.333); for(let i=0;i<3;i++){if(s.normal[i]!==0)center[i]=s.normal[i]*offset;}
 const points=[];
 for(let j=0;j<2;j++)for(let i=0;i<2;i++){
  const u=(i?1:-1)*half,v=(j?1:-1)*half;
  points.push([center[0]+s.u[0]*u+s.v[0]*v,center[1]+s.u[1]*u+s.v[1]*v,center[2]+s.u[2]*u+s.v[2]*v]);
 }
 // UV tile region; orientation follows the sticker's current local u/v basis.
 const u0=s.tile[0]-1/6,u1=s.tile[0]+1/6,v0=s.tile[1]-1/6,v1=s.tile[1]+1/6;
 const verts=[
 ...points[0],...s.normal,u0,v0,
 ...points[1],...s.normal,u1,v0,
 ...points[2],...s.normal,u0,v1,
 ...points[3],...s.normal,u1,v1
 ];
 return {verts,indices:[0,1,2,2,1,3]};
}
function render(){
 requestAnimationFrame(render);if(!gl)return;resize();
 if(anim&&!paused){anim.t+=Math.min(40,performance.now()-(lastTime||performance.now()));if(anim.t>=anim.duration){const m=anim.move;applyMove(m);anim=null;if(queue.length)startNext();else finishSequence();}}
 lastTime=performance.now();
 gl.clearColor(0.973,0.957,0.918,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const aspect=canvas.width/canvas.height,proj=perspective(.72,aspect,.1,100);
 const cp=Math.cos(camera.pitch),eye=[camera.dist*Math.sin(camera.yaw)*cp,camera.dist*Math.sin(camera.pitch),camera.dist*Math.cos(camera.yaw)*cp];
 const view=lookAt(eye,[0,0,0],[0,1,0]),base=multiply(proj,view);
 const loc={aPos:gl.getAttribLocation(program,'aPos'),aNormal:gl.getAttribLocation(program,'aNormal'),aUV:gl.getAttribLocation(program,'aUV')};
 const uMVP=gl.getUniformLocation(program,'uMVP'),uModel=gl.getUniformLocation(program,'uModel'),uTex=gl.getUniformLocation(program,'uTex'),uColor=gl.getUniformLocation(program,'uColor'),uUseTex=gl.getUniformLocation(program,'uUseTex');
 function drawQuad(vertices,indices,model,texture,color,useTexture){
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.DYNAMIC_DRAW);
  const stride=8*4;
  gl.enableVertexAttribArray(loc.aPos);gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,stride,0);
  gl.enableVertexAttribArray(loc.aNormal);gl.vertexAttribPointer(loc.aNormal,3,gl.FLOAT,false,stride,3*4);
  gl.enableVertexAttribArray(loc.aUV);gl.vertexAttribPointer(loc.aUV,2,gl.FLOAT,false,stride,6*4);
  gl.uniformMatrix4fv(uModel,false,model);gl.uniformMatrix4fv(uMVP,false,multiply(base,model));
  gl.uniform3fv(uColor,new Float32Array(color));gl.uniform1f(uUseTex,useTexture?1:0);
  if(texture){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.uniform1i(uTex,0);}
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.DYNAMIC_DRAW);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);
 }
 // Solid dark cubie bodies. Each cubie rotates together with its image stickers.
 function moveModelFor(pos){
  let model=identity();
  if(anim && pos[anim.move.axis]===anim.move.layer){
   const t=Math.min(1,anim.t/anim.duration),ease=t*t*(3-2*t);
   model=rotateModel(model,anim.move.axis,anim.move.dir*Math.PI/2*ease);
  }
  return model;
 }
 for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
  const pos=[x,y,z],center=[x*.333,y*.333,z*.333],r=.159;
  const model=moveModelFor(pos);
  for(const d of Object.values(facesMap)){
   const n=d.normal;
   const fc=[center[0]+n[0]*r,center[1]+n[1]*r,center[2]+n[2]*r];
   const uu=d.u.map(v=>v*r),vv=d.v.map(v=>v*r);
   const ps=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>[fc[0]+uu[0]*a+vv[0]*b,fc[1]+uu[1]*a+vv[1]*b,fc[2]+uu[2]*a+vv[2]*b]);
   const vs=[];ps.forEach((p,i)=>vs.push(...p,...n,i%2,i>1?1:0));
   drawQuad(vs,[0,1,2,2,1,3],model,null,[.018,.027,.045],false);
  }
 }
 stickers.forEach(s=>{
  const model=moveModelFor(s.pos);
  const mesh=createStickerMesh(s);
  drawQuad(mesh.verts,mesh.indices,model,texByFace[s.face],[1,1,1],true);
 });
 $('phase').textContent=paused?'已暂停':(anim?'转动中':phase==='scrambled'?'已打乱':phase==='solved'?'已还原':'已就绪');
}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;camera.yaw+=dx*.009;camera.pitch=clamp(camera.pitch+dy*.009,-1.35,1.35);drag.x=e.clientX;drag.y=e.clientY;});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=clamp(camera.dist+e.deltaY*.008,2.6,12);},{passive:false});
window.addEventListener('resize',resize);
initGL();
window.addEventListener('error', e => {
  const msg = e && e.message ? e.message : '未知脚本错误';
  setStatus('网页运行错误：' + msg + '。请尝试最新版 Chrome/Edge，并重新打开 HTML 文件。');
});
window.addEventListener('unhandledrejection', e => {
  const reason = e && e.reason ? String(e.reason) : '未知异步错误';
  setStatus('网页运行错误：' + reason);
});
})();
</script>
